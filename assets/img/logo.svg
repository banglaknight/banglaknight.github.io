<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D5DAE2"/>
      <stop offset="1" stop-color="#6A7382"/>
    </linearGradient>
    <linearGradient id="plume" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F3D88E"/>
      <stop offset="1" stop-color="#C08A2C"/>
    </linearGradient>
  </defs>
  <!-- plume -->
  <path d="M31 13 C29 5 37 1 46 2 C52 2.5 57 6 58 11 C54 8 48 7.5 44 9.5 C40 11.5 37 13 33 14 Z" fill="url(#plume)"/>
  <!-- helmet shell -->
  <path d="M13 36 C13 21 21 12 32 12 C43 12 51 21 51 36 V50 C51 54.5 48 58 43.5 58 H20.5 C16 58 13 54.5 13 50 Z" fill="url(#steel)"/>
  <!-- shading on right half -->
  <path d="M32 12 C43 12 51 21 51 36 V50 C51 54.5 48 58 43.5 58 H32 Z" fill="#0D1015" opacity=".18"/>
  <!-- center ridge -->
  <rect x="30.6" y="12.5" width="2.8" height="45" rx="1.4" fill="#E8C677" opacity=".85"/>
  <!-- eye slit -->
  <rect x="17" y="31" width="30" height="5.5" rx="2.75" fill="#0D1015"/>
  <!-- breathing holes -->
  <g fill="#0D1015">
    <rect x="21" y="42" width="2.6" height="8" rx="1.3"/>
    <rect x="25.6" y="42" width="2.6" height="8" rx="1.3"/>
    <rect x="35.8" y="42" width="2.6" height="8" rx="1.3"/>
    <rect x="40.4" y="42" width="2.6" height="8" rx="1.3"/>
  </g>
  <!-- gold rim -->
  <path d="M13 50 H51 C51 54.5 48 58 43.5 58 H20.5 C16 58 13 54.5 13 50 Z" fill="#B88A2E" opacity=".9"/>
</svg>
